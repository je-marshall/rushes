<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rushes</title>
<link rel="stylesheet" href="/static/clips.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0f0f0f; color: #e0e0e0; font-family: system-ui, sans-serif; }

header { position: sticky; top: 0; z-index: 20; background: #1a1a1a; border-bottom: 1px solid #2a2a2a; padding: 0.75rem 1.5rem; display: flex; align-items: center; gap: 1.5rem; }
header h1 { font-size: 1.35rem; font-weight: 800; color: #fff; text-transform: lowercase; letter-spacing: -0.03em; font-family: "Montserrat","Poppins","Futura","Century Gothic",system-ui,sans-serif; }
nav { display: flex; gap: 0.5rem; }
nav a { color: #888; text-decoration: none; padding: 0.3rem 0.75rem; border-radius: 999px; font-size: 0.85rem; }
nav a:hover  { background: #2a2a2a; color: #ddd; }
nav a.active { background: #333; color: #fff; }

.filters { padding: 0.6rem 1.5rem; display: flex; gap: 0.5rem; }
.filter-btn { background: #1e1e1e; border: 1px solid #2a2a2a; color: #888; padding: 0.3rem 0.85rem; border-radius: 999px; cursor: pointer; font-size: 0.82rem; }
.filter-btn:hover { background: #2a2a2a; color: #ccc; }
.filter-btn.active { background: #3a1a26; border-color: #ff4d6d; color: #ff8da3; }

#assign-bar { display: none; position: sticky; top: 53px; z-index: 19; background: #1e3a5f; border-bottom: 1px solid #2a5a8f; padding: 0.6rem 1.5rem; align-items: center; gap: 1rem; flex-wrap: wrap; }
#assign-bar.visible { display: flex; }
#assign-bar span { font-size: 0.85rem; color: #aad4ff; }
#assign-bar select, #assign-bar input[type=text] { background: #0f2a45; border: 1px solid #2a5a8f; color: #eee; padding: 0.3rem 0.6rem; border-radius: 4px; font-size: 0.85rem; }
#assign-bar input[type=text] { width: 12rem; }
#assign-bar .or { color: #7fa8d4; font-size: 0.78rem; }
#assign-bar button { background: #2a6abf; border: none; color: #fff; padding: 0.35rem 0.8rem; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }
#assign-bar button:hover { background: #3a7acf; }
#share-btn { margin-left: auto; }
#deselect-btn { background: transparent; border: 1px solid #2a5a8f; color: #aad4ff; padding: 0.3rem 0.6rem; }

.month-header { grid-column: 1 / -1; background: #0f0f0f; padding: 1.4rem 1rem 0.5rem; margin-top: 0.4rem; border-bottom: 1px solid #2a2a2a; color: #ccc; font-size: 0.85rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
.empty { text-align: center; color: #555; margin-top: 6rem; }

dialog { background: #1a1a1a; color: #e0e0e0; border: 1px solid #2a2a2a; border-radius: 8px; padding: 1.5rem; width: min(420px, 92vw); }
dialog::backdrop { background: rgba(0,0,0,0.6); }
dialog h3 { font-size: 1rem; color: #fff; margin-bottom: 1rem; }
dialog label { display: block; font-size: 0.8rem; color: #aaa; margin-bottom: 0.9rem; }
dialog select, dialog input { display: block; width: 100%; margin-top: 0.3rem; background: #0f0f0f; border: 1px solid #333; color: #eee; padding: 0.5rem 0.6rem; border-radius: 5px; font-size: 0.9rem; }
.dialog-actions { display: flex; justify-content: flex-end; gap: 0.6rem; margin-top: 0.5rem; }
.dialog-actions button { padding: 0.45rem 1rem; border-radius: 5px; cursor: pointer; font-size: 0.85rem; border: none; }
.dialog-actions button[type=submit] { background: #2a6abf; color: #fff; }
.dialog-actions button.secondary { background: #2a2a2a; color: #bbb; }

.burger { display: none; background: none; border: none; color: #ccc; font-size: 1.5rem; cursor: pointer; padding: 0.2rem 0.5rem; line-height: 1; }
@media (max-width: 680px) {
  header { flex-wrap: wrap; gap: 0.5rem 1rem; }
  .burger { display: block; margin-left: auto; }
  nav { display: none; flex-direction: column; width: 100%; gap: 0.15rem; }
  nav a { display: block; }
  header > form[action="/logout"] { display: none; width: 100%; margin-left: 0; }
  body.nav-open nav { display: flex; }
  body.nav-open header > form[action="/logout"] { display: block; }
  #assign-bar { flex-wrap: wrap; }
  #share-btn { margin-left: 0; }
}
</style>
</head>
<body>

<header>
  <h1>Rushes</h1>
  <button class="burger" type="button" aria-label="Menu" onclick="document.body.classList.toggle('nav-open')">☰</button>
  <nav>
    <a href="/events">Events</a>
    <a href="/" class="active">Unsorted</a>
    <a href="/cameras">Cameras</a>
    <a href="/import">Import</a>
    <a href="/shares">Shares</a>
    <a href="/settings">Settings</a>
  </nav>
  <form method="post" action="/logout" style="margin-left:auto">
    <button type="submit" style="background:none;border:none;color:#555;cursor:pointer;font-size:0.8rem;padding:0.3rem 0.5rem">Sign out</button>
  </form>
</header>

<div class="filters">
  <button class="filter-btn" id="fav-toggle" type="button" onclick="toggleFav()">♥ Favourites</button>
</div>

<div id="assign-bar">
  <span id="sel-count">0 clips selected</span>
  <form method="post" action="/clips/assign" id="assign-form">
    <input type="hidden" name="clip_ids" id="clip-ids-input">
    <select name="event_id">
      <option value="">— assign to event —</option>
      {% for evt in all_events %}
      <option value="{{ evt.id }}">{{ evt.name }}</option>
      {% endfor %}
    </select>
    <span class="or">or</span>
    <input type="text" name="new_event" placeholder="new event name" autocomplete="off" spellcheck="false">
    <button type="submit">Move</button>
  </form>
  <button id="share-btn" type="button" onclick="openShare()">Share</button>
  <button id="deselect-btn" type="button" onclick="clearSelection()">✕ Deselect all</button>
</div>

<dialog id="share-dialog">
  <form method="post" action="/shares/create">
    <h3>Create share link</h3>
    <input type="hidden" name="clip_ids" id="share-clip-ids">
    <label>Expires
      <select name="expiry">
        <option value="24h">24 hours</option>
        <option value="7d" selected>7 days</option>
        <option value="30d">30 days</option>
        <option value="never">Never</option>
      </select>
    </label>
    <label>Password (optional)
      <input type="text" name="password" autocomplete="off" spellcheck="false" placeholder="leave blank for none">
    </label>
    <div class="dialog-actions">
      <button type="button" class="secondary" onclick="document.getElementById('share-dialog').close()">Cancel</button>
      <button type="submit">Create link</button>
    </div>
  </form>
</dialog>

<p class="empty" id="empty" style="display:none">No unsorted clips — plug in a GoPro to ingest, or check Events.</p>
<div class="grid" id="clip-grid"></div>

<script src="/static/clips.js"></script>
<script>
const grid = document.getElementById('clip-grid');
const selected = new Set();
let favOnly = new URLSearchParams(location.search).get('favourite') === 'true';

// --- month grouping ---
function monthKey(c) { return c.recorded_at ? String(c.recorded_at).slice(0, 7) : 'unknown'; }
function monthLabel(key) {
  if (key === 'unknown') return 'Undated';
  const [y, m] = key.split('-').map(Number);
  return new Date(y, m - 1, 1).toLocaleString('en-GB', { month: 'long', year: 'numeric' });
}
function buildSequence(clips) {
  const items = []; let cur = null;
  for (const c of clips) {
    const k = monthKey(c);
    if (k !== cur) { cur = k; items.push({ type: 'hdr', key: 'hdr:' + k, label: monthLabel(k) }); }
    items.push({ type: 'clip', key: 'clip:' + c.id, data: c });
  }
  return items;
}

function reconcile(clips) {
  const items = buildSequence(clips);
  const existing = new Map([...grid.children].map(n => [n.dataset.key, n]));
  const seen = new Set();
  items.forEach((it, i) => {
    seen.add(it.key);
    let node = existing.get(it.key);
    if (it.type === 'hdr') {
      if (!node) { node = document.createElement('div'); node.className = 'month-header'; node.dataset.key = it.key; node.textContent = it.label; }
    } else {
      if (!node) { node = Clips.createCard(it.data); node.dataset.key = it.key; node.classList.toggle('selected', selected.has(String(it.data.id))); }
      Clips.updateCard(node, it.data);
    }
    if (grid.children[i] !== node) grid.insertBefore(node, grid.children[i] || null);
  });
  existing.forEach((node, key) => { if (!seen.has(key)) { if (key.startsWith('clip:')) selected.delete(key.slice(5)); node.remove(); } });
  document.getElementById('empty').style.display = clips.length ? 'none' : 'block';
  updateBar();
}

// --- selection ---
function selectMode() { return selected.size > 0; }
function toggleSelect(id) {
  id = String(id);
  const card = grid.querySelector(`.clip[data-id="${id}"]`);
  if (selected.has(id)) { selected.delete(id); card && card.classList.remove('selected'); }
  else                  { selected.add(id);    card && card.classList.add('selected');    }
  updateBar();
}
function clearSelection() {
  selected.clear();
  grid.querySelectorAll('.clip.selected').forEach(el => el.classList.remove('selected'));
  updateBar();
}
function openShare() {
  if (!selected.size) return;
  document.getElementById('share-clip-ids').value = [...selected].join(',');
  document.getElementById('share-dialog').showModal();
}
function updateBar() {
  document.body.classList.toggle('select-mode', selectMode());
  document.getElementById('sel-count').textContent = `${selected.size} clip${selected.size === 1 ? '' : 's'} selected`;
  document.getElementById('clip-ids-input').value = [...selected].join(',');
  document.getElementById('assign-bar').classList.toggle('visible', selected.size > 0);
}

// --- favourites filter ---
function toggleFav() {
  favOnly = !favOnly;
  document.getElementById('fav-toggle').classList.toggle('active', favOnly);
  const u = new URL(location);
  if (favOnly) u.searchParams.set('favourite', 'true'); else u.searchParams.delete('favourite');
  history.replaceState(null, '', u);
  refresh();
}

// --- one delegated click handler ---
grid.addEventListener('click', async e => {
  const card = e.target.closest('.clip');
  if (!card) return;
  const id = card.dataset.id;
  if (e.target.closest('.heart'))    { Clips.heartToggle(card); return; }
  if (selectMode())                  { toggleSelect(id); return; }
  if (e.target.closest('.play-btn')) { Clips.openPlayer(card); return; }
  if (e.target.closest('.checkbox')) { toggleSelect(id); return; }
});

// --- live refresh ---
async function refresh() {
  try {
    const q = new URLSearchParams();
    if (favOnly) q.set('favourite', 'true');
    const r = await fetch('/api/unsorted.json?' + q.toString());
    if (r.ok) reconcile((await r.json()).clips);
  } catch (e) {}
}
document.getElementById('fav-toggle').classList.toggle('active', favOnly);
refresh();
setInterval(refresh, 4000);
</script>
</body>
</html>
